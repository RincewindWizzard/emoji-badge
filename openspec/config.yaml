schema: spec-driven

context: |
  Language: de
  All artifacts must be written in de.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: emoji-badge - eigene Rust-Firmware (no_std, esp-hal) fuer ein
  1,75" rundes AMOLED-Board (ESP32-S3R8, 466x466, QSPI, Touch CST9217,
  Dual-Mikrofon, WiFi/BT5). Zielanwendung: Emoji-Badge, spaeter
  XiaoZhi-AI/DeepSeek-Sprachanbindung.
  Architektur: Workspace; `core/` = hardwareunabhaengige, auf dem Host
  testbare Render-Logik (no_std); Firmware-Crate (Xtensa-Toolchain) folgt.

